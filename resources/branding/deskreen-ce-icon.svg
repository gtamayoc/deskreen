<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="screenFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="mobileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0066FF" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="256" height="256" rx="56" fill="url(#screenFill)" />
  <rect width="254" height="254" x="1" y="1" rx="55" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Main Monitor (Desktop Screen) -->
  <g filter="url(#dropShadow)">
    <rect x="36" y="44" width="144" height="104" rx="12" fill="#1E293B" stroke="url(#primaryGrad)" stroke-width="4" />
    <!-- Screen Glare / Top bar -->
    <rect x="44" y="52" width="128" height="12" rx="4" fill="#334155" opacity="0.6" />
    <circle cx="52" cy="58" r="2.5" fill="#EF4444" />
    <circle cx="60" cy="58" r="2.5" fill="#F59E0B" />
    <circle cx="68" cy="58" r="2.5" fill="#10B981" />
    <!-- Code / Console Lines -->
    <path d="M 52 82 L 80 82 M 52 96 L 108 96 M 52 110 L 92 110" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    <path d="M 120 80 L 128 88 L 120 96" stroke="#00D2FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="134" y1="96" x2="148" y2="96" stroke="#00D2FF" stroke-width="3" stroke-linecap="round" />
    <!-- Stand -->
    <path d="M 96 148 L 96 172 M 76 172 L 140 172" stroke="url(#primaryGrad)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Secondary Companion Screen (Mobile Device / Tablet) -->
  <g filter="url(#dropShadow)">
    <rect x="136" y="96" width="84" height="120" rx="14" fill="#0F172A" stroke="url(#mobileGrad)" stroke-width="4" />
    <!-- Notch / Header -->
    <rect x="162" y="103" width="32" height="4" rx="2" fill="#334155" />
    <!-- Mobile Display Content / Interactive Pad -->
    <rect x="146" y="116" width="64" height="40" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <circle cx="158" cy="136" r="5" fill="#00D2FF" />
    <path d="M 172 132 L 198 132 M 172 140 L 190 140" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Action Keypad Buttons -->
    <rect x="146" y="164" width="30" height="18" rx="4" fill="#1E293B" stroke="#0066FF" stroke-width="1" />
    <text x="161" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#00D2FF" text-anchor="middle">AI</text>
    
    <rect x="180" y="164" width="30" height="18" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1" />
    <text x="195" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#10B981" text-anchor="middle">OK</text>
    
    <!-- Home Bar Indicator -->
    <line x1="164" y1="206" x2="192" y2="206" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- P2P High-speed Bridge Signal Waves -->
  <path d="M 120 120 C 130 115, 134 110, 140 108" fill="none" stroke="#00D2FF" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round" />
  <circle cx="120" cy="120" r="3.5" fill="#0066FF" />
  <circle cx="140" cy="108" r="3.5" fill="#10B981" />
</svg>
