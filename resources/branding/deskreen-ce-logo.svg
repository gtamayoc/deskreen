<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120">
  <defs>
    <linearGradient id="logoPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="logoMobileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0066FF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Icon Mark on Left (Center x=60, y=60) -->
  <g transform="translate(10, 8) scale(0.42)" filter="url(#logoGlow)">
    <rect width="240" height="240" rx="48" fill="#0F172A" stroke="#334155" stroke-width="4" />
    <!-- Monitor -->
    <rect x="30" y="36" width="136" height="96" rx="10" fill="#1E293B" stroke="url(#logoPrimaryGrad)" stroke-width="5" />
    <path d="M 46 72 L 72 72 M 46 86 L 98 86" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    <path d="M 88 132 L 88 156 M 68 156 L 128 156" stroke="url(#logoPrimaryGrad)" stroke-width="5" stroke-linecap="round" />
    <!-- Companion Mobile -->
    <rect x="124" y="80" width="82" height="118" rx="12" fill="#0F172A" stroke="url(#logoMobileGrad)" stroke-width="5" />
    <rect x="134" y="100" width="62" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="2" />
    <circle cx="146" cy="120" r="5" fill="#00D2FF" />
    <line x1="158" y1="120" x2="184" y2="120" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
    <!-- Action button -->
    <rect x="136" y="148" width="28" height="16" rx="4" fill="#0066FF" />
    <text x="150" y="160" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AI</text>
    <rect x="168" y="148" width="28" height="16" rx="4" fill="#10B981" />
    <text x="182" y="160" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OK</text>
  </g>

  <!-- Typography Right -->
  <g transform="translate(136, 0)">
    <!-- Primary Title: DESKREEN -->
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="#0F172A">
      DESKREEN
    </text>
    
    <!-- Dark Mode Fallback (CSS styling for adaptive rendering) -->
    <style>
      @media (prefers-color-scheme: dark) {
        text.brand-name { fill: #F8FAFC !important; }
        text.brand-sub { fill: #94A3B8 !important; }
      }
    </style>

    <!-- Badge CE -->
    <g transform="translate(244, 25)">
      <rect width="64" height="42" rx="8" fill="url(#logoPrimaryGrad)" />
      <text x="32" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CE</text>
    </g>

    <!-- Subtitle: COMMUNITY EDITION -->
    <text x="2" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Consolas, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5" fill="#0066FF">
      COMMUNITY EDITION
    </text>
    
    <!-- Secondary descriptor -->
    <text x="220" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="0.5" fill="#64748B">
      • Secondary Displays &amp; AI Consoles
    </text>
  </g>
</svg>
